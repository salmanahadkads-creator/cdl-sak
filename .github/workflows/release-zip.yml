name: Publish skill zip

on:
  push:
    branches: [main]
    paths: ["plugins/cdl-sak/skills/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build cdl-sak.zip
        run: cd plugins/cdl-sak/skills && zip -r "$GITHUB_WORKSPACE/cdl-sak.zip" cdl-sak
      - name: Update the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest cdl-sak.zip \
            --title "cdl-sak (latest)" \
            --notes "Built from ${GITHUB_SHA::7}. Upload this zip in claude.ai under Settings > Capabilities > Skills." \
            --latest
